    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #64748b;
        --border: rgba(24, 36, 56, 0.12);
        --accent: #2563eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Noto Sans SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 18% 0%, rgba(37, 99, 235, 0.1), transparent 30%), var(--bg);
        color: var(--text);
      }
      main {
        width: min(880px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.25;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      .list {
        display: grid;
        gap: 14px;
        margin-top: 28px;
      }
      a {
        display: block;
        padding: 18px 20px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        color: inherit;
        text-decoration: none;
        box-shadow: 0 8px 24px rgba(24, 36, 56, 0.08);
      }
      a:hover {
        border-color: rgba(37, 99, 235, 0.4);
      }
      strong {
        display: block;
        margin-bottom: 4px;
        color: var(--accent);
        font-size: 16px;
      }
      span {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
